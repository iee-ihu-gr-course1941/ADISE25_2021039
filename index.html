<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ΞΕΡΗ LIVE</title>

 
  <!-- ΔΙΚΟ ΜΑΣ JS -->
   <script SRC="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/xeri.js"></script>
   <style>
    .table-card {
    font-size: 24px;
    background: #f4f4f4;
    border: 2px solid #000;
}
.my-card {
    cursor: pointer;
}
.my-card:hover {
    background: #dff0ff;
}

    .card {
        display: inline-block;
        padding: 6px 10px;
        margin: 4px;
        border: 1px solid #333;
        border-radius: 4px;
        font-weight: bold;
        background: #fff;
        font-family: monospace;
    }
  </style>
</head>

<body>
  <h1>ΞΕΡΗ LIVE</h1>

  <!-- LOGIN -->
  <div id="game_initializer">
    <input id="username" placeholder="Όνομα χρήστη">
    <select id="player">
       <option value="P1">Παίκτης 1</option>
       <option value="P2">Παίκτης 2</option>
    </select>

    <button id="login_btn" class="btn btn-primary"> ΕΙΣΟΔΟΣ ΣΤΟ ΠΑΙΧΝΙΔΙ</button>
  </div>

  <div id="game_info"></div>
<div id="my_hand"></div>
<div id="table_cards"></div>
<br>
<div id="table_count"></div>
<br>
<div>
  Ο αντίπαλος έχει <span id="opponent_cards"></span> φύλλα
</div>
<br> 
<div id="xeri_box">
  <p>Ξερές (ίδιες): <span id="xeri_normal">0</span></p>
  <p>Ξερές (βαλές): <span id="xeri_jack">0</span></p>
</div>

<div id="game_end_box" style="display:none; border:2px solid black; padding:20px; margin-top:20px;">
    <h2 id="game_end_msg"></h2>
    <button id="game_end_ok">OK</button>
</div>



</body>
</html>
